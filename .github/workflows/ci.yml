name: CI Build Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: CI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: macos-universal
            os: macos-latest
          - target: windows-x86_64
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux x86_64)
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev

      - name: Build (Linux x86_64)
        if: matrix.target == 'linux-x86_64'
        run: |
          make clean
          make

      - name: Build (macOS Universal)
        if: matrix.target == 'macos-universal'
        run: |
          make clean
          make macos-universal

      - name: Setup MSYS2 (Windows x86_64)
        if: matrix.target == 'windows-x86_64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            git

      - name: Build PDCurses from source (Windows x86_64)
        if: matrix.target == 'windows-x86_64'
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/wmcbrine/PDCurses.git pdcurses-src
          cd pdcurses-src/wincon
          make DLL=N WIDE=Y UTF8=Y

      - name: Build game (Windows x86_64)
        if: matrix.target == 'windows-x86_64'
        shell: msys2 {0}
        run: |
          g++ -std=c++20 -O2 -Wall \
            -DPDC_WIDE -DPDC_FORCE_UTF8 \
            -Ipdcurses-src \
            main.cpp -o game.exe \
            pdcurses-src/wincon/pdcurses.a
